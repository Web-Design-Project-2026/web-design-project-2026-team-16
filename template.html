<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PreSummerFestival</title>

    <!-- Styles -->
    <link rel="stylesheet" href="global.css" />

    <!-- Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- javascript -->
    <script src="global.js" defer></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.574.0/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/lucide@0.574.0"></script>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img
          src="/assets/images/PSF Logo.png"
          alt="PreSummerFestival Logo"
          class="logo"
        />
      </div>
      <div class="menu-btn-container">
        <button class="menu-btn js-nav-toggle" title="Open navigation menu">
          <i data-lucide="menu" stroke-width="1"></i>
        </button>
      </div>
    </header>

    <aside class="navigation-menu">
      <nav>
        <div class="close-btn-container js-nav-toggle">
          <i data-lucide="x" stroke-width="1" class="menu-close-btn"></i>
        </div>
        <ul>
          <li>
            <a href="index.html">
              <i data-lucide="house"></i>
              <span class="nav-text">Home</span>
            </a>
          </li>
          <li>
            <a href="tickets.html">
              <i data-lucide="ticket-plus"></i>
              <span class="nav-text">Tickets</span>
            </a>
          </li>
          <li>
            <a href="schedule.html">
              <i data-lucide="calendar-clock"></i>
              <span class="nav-text">Schedule</span>
            </a>
          </li>
          <li>
            <a href="map.html">
              <i data-lucide="map"></i>
              <span class="nav-text">Map</span>
            </a>
          </li>
          <li>
            <a href="rules.html">
              <i data-lucide="hand-heart"></i>
              <span class="nav-text">Rules</span>
            </a>
          </li>
          <li>
            <a href="lineup.html">
              <i data-lucide="list-music"></i>
              <span class="nav-text">Line-Up</span>
            </a>
          </li>
          <li>
            <a href="aboutus.html">
              <i data-lucide="info"></i>
              <span class="nav-text">About Us</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
